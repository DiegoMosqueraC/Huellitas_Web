<!DOCTYPE html>
<!--
  Proyecto: Huellitas Web - Detalle de un animal en adopción.
  Consume GET /api/animales/{id}/ (js/detalle.js) y reutiliza los componentes
  <hh-encabezado> y <hh-pie> de js/componentes.js.
  NOTA: organización y datos de EJEMPLO con fines académicos.
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ficha de un animal en adopción de la Fundación Huellitas de Esperanza (ejemplo).">
  <meta name="author" content="Diego Alejandro Mosquera Caicedo, José Miguel Vera Castillo, Camilo Andres Jaimes Gamboa">
  <title>Detalle del animal | Huellitas de Esperanza</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <!-- Tipografías: Fredoka (títulos) y Nunito Sans (texto). Si no hay internet se usan las del sistema. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito+Sans:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
  <!-- Scripts clásicos con defer (no módulos): así la página también funciona al abrirla con doble clic. -->
  <script defer src="js/api.js"></script>
  <script defer src="js/componentes.js"></script>
  <script defer src="js/detalle.js"></script>
</head>
<body>

  <hh-encabezado pagina="detalle"></hh-encabezado>
  <noscript>
    <p class="mensaje mensaje--aviso">Esta página necesita JavaScript para mostrar la ficha del animal.</p>
  </noscript>

  <main>
    <section id="detalle-animal" aria-live="polite">
      <p>Cargando la ficha del animal…</p>
    </section>
  </main>

  <hh-pie></hh-pie>

</body>
</html>
